<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meet the leadership team of University Church of the Nazarene." />
    <meta name="keywords" content="church leaders, pastors, ministry team, ANU" />
    <title>Leaders | University Church of the Nazarene</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-config.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/admin-access.js"></script>
    <script defer src="js/leaders-page.js"></script>
</head>
<body>
    <div id="site-header"></div>
    <main>
        <!-- Hero removed to keep focus on leader profiles -->

        <p class="leaders-page-status" id="leaders-page-status" role="status" aria-live="polite">Loading leaders…</p>
        <section id="church-leaders-section" hidden>
            <div class="container">
                <h2 class="section-title">Church Leaders</h2>
                <div class="grid grid-cols-280" id="church-leaders-grid" aria-busy="true"></div>
            </div>
        </section>
        <section id="ministries-leaders-section" hidden>
            <div class="container">
                <h2 class="section-title">Ministries Leaders</h2>
                <div class="grid grid-cols-280" id="ministries-leaders-grid" aria-busy="true"></div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
