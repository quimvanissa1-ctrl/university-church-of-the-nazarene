<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Event registration form for University Church of the Nazarene events." />
    <title>Event Registration | University Church of the Nazarene</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-config.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/admin-access.js"></script>
    <script defer src="js/event-registration.js"></script>
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <div>
                    <h1 id="event-registration-title">Event Registration</h1>
                    <p id="event-registration-summary">Open the event registration form to complete your response.</p>
                </div>
            </div>
        </section>

        <section>
            <div class="container">
                <div class="info-panel">
                    <p id="event-registration-status" role="status" aria-live="polite"></p>
                    <div id="event-registration-form-container"></div>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
