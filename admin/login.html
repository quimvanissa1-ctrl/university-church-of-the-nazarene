<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Administrator sign in for University Church of the Nazarene." />
    <title>Admin Login | University Church of the Nazarene</title>
    <link rel="stylesheet" href="admin.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../js/supabase-config.js"></script>
    <script defer src="admin.js"></script>
</head>
<body data-admin-page="login">
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="auth-title">
            <a class="brand" href="../index.html">
                <img src="../images/mylogo.png" alt="" />
                <span>University Church<br />of the Nazarene</span>
            </a>

            <div id="login-view">
                <h1 id="auth-title">Welcome back</h1>
                <p class="auth-intro">Sign in to manage church website settings.</p>
                <div class="auth-message" id="login-message" role="status" aria-live="polite" hidden></div>
                <form id="login-form">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="username" required />
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" autocomplete="current-password" required />
                        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password">Show</button>
                    </div>
                    <button class="primary-button" id="login-button" type="submit">
                        <span class="button-label">Sign in</span>
                        <span class="button-spinner" aria-hidden="true"></span>
                    </button>
                </form>
                <button class="text-button" type="button" data-show-reset>Forgot Password?</button>
            </div>

            <div id="reset-request-view" hidden>
                <h1>Reset your password</h1>
                <p class="auth-intro">We’ll email you a secure link to choose a new password.</p>
                <div class="auth-message" id="reset-message" role="status" aria-live="polite" hidden></div>
                <form id="reset-request-form">
                    <label for="reset-email">Email address</label>
                    <input id="reset-email" name="email" type="email" autocomplete="email" required />
                    <button class="primary-button" id="reset-button" type="submit">
                        <span class="button-label">Send reset link</span>
                        <span class="button-spinner" aria-hidden="true"></span>
                    </button>
                </form>
                <button class="text-button" type="button" data-show-login>Back to sign in</button>
            </div>

            <div id="reset-password-view" hidden>
                <h1>Choose a new password</h1>
                <div class="auth-message" id="new-password-message" role="status" aria-live="polite" hidden></div>
                <form id="reset-password-form">
                    <label for="new-password">New password</label>
                    <div class="password-field">
                        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
                        <button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="Show password">Show</button>
                    </div>
                    <label for="confirm-password">Confirm new password</label>
                    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
                    <button class="primary-button" id="update-password-button" type="submit">
                        <span class="button-label">Update password</span>
                        <span class="button-spinner" aria-hidden="true"></span>
                    </button>
                </form>
            </div>

            <a class="return-link" href="../index.html">← Return to church website</a>
        </section>
        <p class="auth-footer">University Church of the Nazarene</p>
    </main>
</body>
</html>
