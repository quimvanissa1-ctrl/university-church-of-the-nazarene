<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upcoming church events and community gatherings at University Church of the Nazarene." />
    <meta name="keywords" content="church events, community events, worship events, ANU" />
    <title>Events | University Church of the Nazarene</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-config.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/admin-access.js"></script>
    <script defer src="js/events-page.js"></script>
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <div>
                    <h1>Events</h1>
                    <p>Join us for worship, fellowship, and service. All are welcome.</p>
                    <div class="hero-actions">
                        <a class="btn btn-secondary" href="bible-quiz.html">Bible Games</a>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="container">
                <h2 class="section-title">Upcoming Events</h2>
                <p class="events-page-status" id="events-page-status" role="status" aria-live="polite">Loading events…</p>
                <div class="grid grid-cols-260" id="upcoming-events-container" aria-busy="true"></div>

                <div class="section-divider"></div>

                <h2 class="section-title">Past Events</h2>
                <div class="grid grid-cols-260" id="past-events-container"></div>

                <div class="info-panel">
                    <h3>Mark Your Calendar</h3>
                    <p>Browse upcoming events and stay connected to all the ways we gather to worship, learn, and serve.</p>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
